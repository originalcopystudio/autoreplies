# OpenReply on Netlify (Netlify + Supabase port — no Redis, no resident worker)
#
# The Next.js app (dashboard, OAuth callback, webhook) runs on Netlify's
# Next.js runtime. The four scheduled functions below replace vercel.json's
# crons plus the worker's polling loop: they call the app's own /api/cron/*
# routes with the CRON_SECRET bearer token.
#
# Required environment variables (Site settings → Environment variables):
#   NEXTAUTH_URL, NEXTAUTH_SECRET, CRON_SECRET, ENCRYPTION_KEY,
#   DATABASE_URL  (Supabase pooled connection string, port 6543),
#   RESEND_API_KEY, EMAIL_FROM,
#   META_GRAPH_API_VERSION, INSTAGRAM_APP_ID, INSTAGRAM_APP_SECRET,
#   FACEBOOK_APP_SECRET, WEBHOOK_VERIFY_TOKEN

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "netlify/functions"
